[main]
keepcache=1
retries=20
gpgcheck=1
install_weak_deps=0
metadata_expire=-1
best=1
tsflags=nodocs
max_parallel_downloads=20

# The Terra repos package anda and its srpm macros (not in Fedora proper).

[terra]
name=Terra $releasever
baseurl=https://repos.fyralabs.com/terra$releasever
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra-extras]
name=Terra $releasever (Extras)
baseurl=https://repos.fyralabs.com/terra$releasever-extras
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-extras
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=150
