# anda-update — daily upstream version sweep (replaces copr-bump.yml).
#
# `anda update` runs every package's update.rhai (the ports of the old
# fetch.sh); the rhai scripts edit their spec in place and anda writes the file
# when the content actually changed. Terra pushes sweep commits straight to its
# branch — this repo keeps its review gate: the sweep lands on one
# bump/<date> branch and opens a single PR, whose merge triggers anda-build.yml
# (changed packages + every higher batch).
#
# GITHUB_TOKEN is what the andax gh_* helpers (gh/gh_tag/gh_commit/...) use;
# without it the API rate limit throttles the sweep.
name: anda-update

on:
  schedule:
    - cron: "17 04 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: anda-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/halcyon-builder:f44
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Tooling is in the image (anda, rpmdevtools, gh); only checkout is needed
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "halcyon-autoupdate"
          git config user.email "aahsnr041@proton.me"
      - name: anda update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: anda update
      - name: Push the bump branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to bump"
            exit 0
          fi
          date_tag="$(date -u +%Y%m%d)"
          pkgs="$(git status --porcelain -- anda/ | awk '{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          git add anda/
          git commit -m "bump: ${date_tag} (${pkgs})"
          git checkout -B "bump/${date_tag}"
          git push -u origin "bump/${date_tag}"
          gh pr create --head "bump/${date_tag}" \
            --title "chore(bump): upstream versions $(date -u +%Y-%m-%d)" \
            --body "Automated by .github/workflows/anda-update.yml (\`anda update\`). Review the version transitions and merge — anda-build.yml then builds the changed packages and every package in a higher batch."
