# r2-mirror — serve the halcyon repo from Cloudflare R2.
#
# Why: Copr's Pulp backend 302s every RPM download to a presigned S3 URL in
# us-east-1 (no CDN on the bytes), which is single-stream slow from many
# networks — measured ~78 KB/s where a Cloudflare edge gives ~11 MB/s. This
# mirrors Packages/ + repodata/ (everything dnf reads) to R2 after every
# cascade; consumers point halcyon-mirror.repo at the bucket's public base.
# Packages are bit-identical and signed with the same project GPG key, so
# the mirror itself needs no trust: gpgcheck verifies every RPM.
#
# Setup (one-time, in the GitHub repo settings):
#   secrets: R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY — an R2 API token with
#            Object Read & Write on the bucket
#   vars:    R2_ENDPOINT     https://<account-id>.r2.cloudflarestorage.com
#            R2_BUCKET       the bucket name (e.g. halcyon)
#            R2_PUBLIC_BASE  the public base served to consumers
#                            (https://pub-<id>.r2.dev or your own domain)
# The job skips itself until those three vars exist.
name: r2-mirror

on:
  workflow_dispatch:
  workflow_run:
    workflows: [copr-build]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: r2-mirror
  cancel-in-progress: true

jobs:
  sync:
    # fire only after a completed cascade, and skip until the R2 vars exist
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && vars.R2_ENDPOINT != '' && vars.R2_BUCKET != '' && vars.R2_PUBLIC_BASE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships rclone; the R2 connection is configured purely
      # through environment variables (no config file with credentials)
      - name: Sync Packages/ and repodata/ from Copr to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -eu
          base="https://download.copr.fedorainfracloud.org/results/aahsnr-work/halcyon/fedora-44-x86_64"
          rclone sync \
            --http-url "$base" :http: \
            "r2:${{ vars.R2_BUCKET }}/fedora-44-x86_64" \
            --include "Packages/**" \
            --include "repodata/**" \
            --s3-no-check-bucket \
            --transfers 8 --checkers 16 \
            --stats-one-line -v
      - name: Verify the mirror serves repodata
        run: |
          set -eu
          curl -fsSI --max-time 30 \
            "${{ vars.R2_PUBLIC_BASE }}/fedora-44-x86_64/repodata/repomd.xml" \
            | head -1
