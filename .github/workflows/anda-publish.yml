# anda-publish — sign, index and deploy one batch wave.
#
# Two targets:
#   pages (default)  the GitHub Pages dnf repo — the 42 hand-maintained
#                    packages (sign + createrepo_c + prune + gh-pages deploy;
#                    PRs: validation only)
#   r2               the Cloudflare R2 bucket — the texlive-texmf set, whose
#                    output is far beyond the Pages budget (ci/publish-r2.sh;
#                    also skipped for pull requests)
#
# Secrets:
#   GPG_PRIVATE_KEY    the repo's RPM signing key (armored)
#   GPG_PASSPHRASE     its passphrase, empty for passphrase-less keys
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT / R2_LOCAL_HOST
#                      the R2 S3 credentials + public domain (r2 target)
name: anda-publish

on:
  workflow_call:
    inputs:
      batch:
        description: "Batch number whose artifacts (named '<batch>-*') to publish"
        required: true
        type: number
      target:
        description: "Publishing target: pages or r2"
        required: false
        type: string
        default: pages

permissions:
  contents: write

jobs:
  publish:
    name: "sign + createrepo + ${{ inputs.target }} deploy (batch ${{ inputs.batch }})"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/halcyon-builder:f44
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Import the RPM signing key
        if: github.event_name != 'pull_request'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Download the wave's RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: "${{ inputs.batch }}-*"
          merge-multiple: true
          path: rpms
      - name: Split source RPMs out
        run: |
          set -eu
          mkdir -p srpms
          for f in rpms/*.src.rpm; do
            [ -e "$f" ] || continue
            mv -v "$f" srpms/
          done
      - name: Publish to GitHub Pages (sign + createrepo_c + prune + deploy)
        if: github.event_name != 'pull_request' && inputs.target == 'pages'
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ci/publish.sh rpms srpms
      - name: Publish to the R2 bucket (sign + createrepo_c + rclone sync)
        if: github.event_name != 'pull_request' && inputs.target == 'r2'
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_LOCAL_HOST: ${{ vars.R2_LOCAL_HOST }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: ci/publish-r2.sh rpms srpms
      - name: Pull request — validation only
        if: github.event_name == 'pull_request'
        run: |
          echo "pull request: $(find rpms -name '*.rpm' | wc -l) RPM(s) built; nothing published"
