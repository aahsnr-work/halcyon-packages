name: builder-image
permissions:
  contents: read
  packages: write
on:
  push:
    branches: [main]
    paths: [".github/builder/**", "mock/**", ".github/workflows/builder-docker.yml"]
  pull_request:
    paths: [".github/builder/**", "mock/**", ".github/workflows/builder-docker.yml"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # buildx with the docker-container driver — the default docker driver
      # cannot export caches (cache-to: type=gha) and fails the build
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/builder/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/halcyon-builder:f44
          cache-from: type=gha
          cache-to: type=gha,mode=max
