# repoclosure — dependency-closure check of the published Copr repo.
#
# Adapted from LionHeartP/hyprlandRPM's repoclosure.yml: run dnf's
# repoclosure against EVERYTHING published in aahsnr-work/halcyon and fail
# if any RPM's dependencies cannot resolve against Fedora 44 (+ Terra 44,
# which the buildroot also supplies). This catches what per-package builds
# cannot: a package whose runtime Requires nothing satisfies — a new
# hyprland needing a newer lib than Fedora 44 has, a broken texlive group
# pin, a bumped-away dependency.
#
# The repo drop-in is the checked-in repo/halcyon.repo (the consumer
# file itself — baseurl, gpgkey, priority=1), so the check sees exactly
# what consumers see. --newest resolves against the newest packages only;
# the second step adds --best (stricter: prefers the best candidate across
# repos instead of failing over).
#
# Two ways this check can sample a half-published repo, both handled below
# instead of by blind retries:
#   1. A cascade publishes builds one by one and Copr regenerates the repo
#      metadata after each — a sample taken while a copr-build run is
#      queued/in flight sees stale-vs-new version skew (a texlive group
#      requiring texlive-latex = <snapshot> before latex's own build
#      lands). The run skips entirely while a cascade is in flight.
#   2. Copr can leave the SERVED repodata behind the published packages for
#      hours once a cascade ends — observed 2026-09-28: four texlive
#      groups were published by 09:00Z but absent from the repodata until
#      the next cascade's builds forced a regen at 15:55Z (no builds ran
#      in between, so nothing else triggered one). copr-cli
#      regenerate-repos forces the rebuild, so every failed attempt is
#      followed by a forced regen before retrying.
name: repoclosure

on:
  workflow_dispatch:
  schedule:
    - cron: "43 05 * * *"
  # re-check right after every cascade lands new packages
  workflow_run:
    workflows: [copr-build]
    types: [completed]

permissions:
  contents: read
  actions: read # the in-flight-cascade gate lists copr-build runs

concurrency:
  group: repoclosure
  cancel-in-progress: true

jobs:
  repoclosure:
    # workflow_run fires for failed runs too; only check after a completed
    # cascade (a failed one did not publish anything new)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the repo drop-ins (all six halcyon groups + Terra 44 + lionheartp)
        run: |
          set -eu
          # every group's consumer drop-in lives in repo/ — install them all so
          # each per-repo closure check sees exactly what consumers see. (The
          # halcyon-mirror.repo alternative is NOT installed: it proxies the
          # core repo only and would double-enable the desktop packages.)
          for g in "" -cli -apps -fonts -texlive -kernel; do
            cp "repo/halcyon$g.repo" /etc/yum.repos.d/
          done
          cat > /etc/yum.repos.d/terra.repo <<'EOF'
          [terra]
          name=Terra 44
          baseurl=https://repos.fyralabs.com/terra$releasever/
          type=rpm-md
          gpgcheck=1
          gpgkey=https://repos.fyralabs.com/terra$releasever/key.asc
          enabled=1
          EOF
          # the lionheartp bootstrap repo is part of the Copr buildroot; kitty's
          # shader-slang-devel resolves only through it (documented in its spec)
          cat > /etc/yum.repos.d/lionheartp.repo <<'EOF'
          [lionheartp]
          name=Copr repo for Hyprland owned by LionHeartP
          baseurl=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-$releasever-$basearch/
          type=rpm-md
          skip_if_unavailable=True
          gpgcheck=1
          gpgkey=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/pubkey.gpg
          enabled=1
          EOF
      - name: Copr credentials
        env:
          COPR_CLICONF: ${{ secrets.COPR_CLICONF }}
        run: |
          set -eu
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CLICONF" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Install copr-cli
        run: dnf -qy install copr-cli
      - name: Repoclosure (newest, then newest+best; regenerate-and-retry on failure)
        env:
          GH_TOKEN: ${{ github.token }}
          COPR_PROJECTS: "aahsnr-work/halcyon aahsnr-work/halcyon-cli aahsnr-work/halcyon-apps aahsnr-work/halcyon-fonts aahsnr-work/halcyon-texlive aahsnr-work/halcyon-kernel"
        run: |
          set -u
          in_flight() {
            # queued or running copr-build cascade => the repo is mid-publish
            for st in queued in_progress; do
              n=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/copr-build.yml/runs?status=$st&per_page=1" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))' \
                  2>/dev/null || echo 0)
              [ "$n" -gt 0 ] && return 0
            done
            return 1
          }
          if in_flight; then
            echo "a copr-build cascade is queued/in flight — the published repo is mid-publish; skipping this check"
            exit 0
          fi
          if [ "${{ github.event_name }}" = workflow_run ]; then
            # the cascade just landed — make sure the served repodata is the
            # post-cascade state before judging it
            for p in $COPR_PROJECTS; do copr-cli regenerate-repos "$p"; done
          fi
          attempt=0; max=4
          while :; do
            attempt=$((attempt+1))
            rc=0
            # both supported Fedora releases: the group repos, lionheartp and
            # Terra are all $releasever-parameterized, so one --releasever flip
            # retargets the whole resolution set
            for rv in 44 45; do
              for p in $COPR_PROJECTS; do
                grp=${p#*/}
                echo "::group::repoclosure fc$rv ($grp) attempt $attempt"
                if dnf -q --releasever=$rv repoclosure \
                     --check "copr:copr.fedorainfracloud.org:aahsnr-work:$grp" \
                     --newest \
                  && dnf -q --releasever=$rv repoclosure \
                     --check "copr:copr.fedorainfracloud.org:aahsnr-work:$grp" \
                     --newest --best; then
                  echo "fc$rv $grp: closed"
                else
                  echo "fc$rv $grp: UNRESOLVED DEPENDENCIES"
                  rc=1
                fi
                echo "::endgroup::"
              done
            done
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "repoclosure still failing after $attempt attempts"
              exit 1
            fi
            echo "attempt $attempt failed — forcing repo metadata regens (stale-repodata guard), then retrying"
            for p in $COPR_PROJECTS; do copr-cli regenerate-repos "$p"; done
            sleep 180
          done
