# repoclosure — dependency-closure check of the published Copr repo.
#
# Adapted from LionHeartP/hyprlandRPM's repoclosure.yml: run dnf's
# repoclosure against EVERYTHING published in aahsnr-work/halcyon and fail
# if any RPM's dependencies cannot resolve against Fedora 44 (+ Terra 44,
# which the buildroot also supplies). This catches what per-package builds
# cannot: a package whose runtime Requires nothing satisfies — a new
# hyprland needing a newer lib than Fedora 44 has, a broken texlive group
# pin, a bumped-away dependency.
#
# The repo drop-in is the checked-in repo/halcyon.repo (the consumer
# file itself — baseurl, gpgkey, priority=1), so the check sees exactly
# what consumers see. --newest resolves against the newest packages only;
# the second step adds --best (stricter: prefers the best candidate across
# repos instead of failing over).
name: repoclosure

on:
  workflow_dispatch:
  schedule:
    - cron: "43 05 * * *"
  # re-check right after every cascade lands new packages
  workflow_run:
    workflows: [copr-build]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: repoclosure
  cancel-in-progress: true

jobs:
  repoclosure:
    # workflow_run fires for failed runs too; only check after a completed
    # cascade (a failed one did not publish anything new)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the repo drop-ins (halcyon + Terra 44)
        run: |
          set -eu
          cp repo/halcyon.repo /etc/yum.repos.d/
          cat > /etc/yum.repos.d/terra.repo <<'EOF'
          [terra]
          name=Terra 44
          baseurl=https://repos.fyralabs.com/terra44/
          type=rpm-md
          gpgcheck=1
          gpgkey=https://repos.fyralabs.com/terra44/key.asc
          enabled=1
          EOF
          # the lionheartp bootstrap repo is part of the Copr buildroot; kitty's
          # shader-slang-devel resolves only through it (documented in its spec)
          cat > /etc/yum.repos.d/lionheartp.repo <<'EOF'
          [lionheartp]
          name=Copr repo for Hyprland owned by LionHeartP
          baseurl=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-$releasever-$basearch/
          type=rpm-md
          skip_if_unavailable=True
          gpgcheck=1
          gpgkey=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/pubkey.gpg
          enabled=1
          EOF
      - name: Repoclosure (newest)
        run: |
          set -eu
          dnf -q repoclosure \
            --check copr:copr.fedorainfracloud.org:aahsnr-work:halcyon \
            --newest
      - name: Repoclosure (newest + best)
        run: |
          set -eu
          dnf -q repoclosure \
            --check copr:copr.fedorainfracloud.org:aahsnr-work:halcyon \
            --newest --best
