# ci/packages.toml — the halcyon-packages build registry.
#
# Consumed by ci/matrix.py. One table per package; **a package without an
# entry is not built**. The build configuration itself lives in each package's
# anda/<pkg>/anda.hcl; this file is the dependency-order registry.
#
# Batches are dependency levels, not parallel groups within one job:
# anda-build.yml runs the waves sequentially and publishes each wave to the
# Pages repo before the next one starts — so a package may rely on anything
# built in a lower batch (this is the job Copr did with --after-build-id /
# --with-build-id). Packages inside one batch must therefore never depend on
# each other.
#
# Build-time dependencies that Fedora 44 does not provide are packaged in
# THIS repo (glaze, hyprwire, hyprtoolkit — ports of the lionheartp/Hyprland
# Copr specs; the fourth Copr input, wlroots, ships in Fedora 44 itself and
# is used straight from there). The Copr remains in the mock config only
# as a lowest-priority bootstrap for fresh checkouts; once a wave publishes,
# our own repo (priority 10) wins the same-named packages.
#
# batch 0  roots: Fedora-only build deps (plus the wrapper/binary packages)
# batch 1  first level: everything that links against batch 0
# batch 2  hyprland, hyprtoolkit — links against batch 0 and batch 1
# batch 3  the hyprtoolkit dependents (guiutils/pwcenter/shutdown)
# batch 4  texlive-texmf, its own wave

# --------------------------------------------------------------- desktops

# --- batch 0 ------------------------------------------------------------
[hyprutils]
batch = 0

[hyprlang]
batch = 0

[hyprwayland-scanner]
batch = 0

[hyprland-protocols]
batch = 0

# glaze: header-only JSON library (provides glaze-static/glaze-devel for
# hyprland and hyprshutdown). Ported from LionHeartP/hyprlandRPM.
[glaze]
batch = 0

# --- batch 1 ------------------------------------------------------------
# hyprland-qt-support needs hyprlang, so it cannot share hyprlang's batch.
[hyprland-qt-support]
batch = 1

[aquamarine]
batch = 1

[hyprcursor]
batch = 1

[hyprgraphics]
batch = 1

# hyprwire: hyprland's wire-protocol IPC library (needs hyprutils).
[hyprwire]
batch = 1

# the greeter is standalone (all build deps are Fedora 44; wlroots ships in
# Fedora proper), but it builds one wave after noctalia by design so the
# shell is always published first
[noctalia-greeter-git]
batch = 1

[xdg-desktop-portal-hyprland]
batch = 1

# pyprland: Hyprland companion daemon (hatchling wheel + compiled C client,
# per the AUR PKGBUILD); version sweeps the git tags.
[pyprland]
batch = 0

# --- batch 2 ------------------------------------------------------------
# hyprland: git snapshot (main-branch pin), the ~15-minute one. Needs
# glaze (batch 0) and hyprwire (batch 1) from this repo.
[hyprland]
batch = 2

# hyprtoolkit: the GUI toolkit for guiutils/pwcenter/shutdown (needs
# aquamarine + hyprgraphics from batch 1).
[hyprtoolkit]
batch = 2

# --- batch 3 ------------------------------------------------------------
# the hyprtoolkit dependents: hyprtoolkit is batch 2, these must wait for
# it to publish.
[hyprland-guiutils]
batch = 3

[hyprpwcenter]
batch = 3

[hyprshutdown]
batch = 3

# ------------------------------------------------------------------- apps
# bun tracks terrapkg's spec: the -baseline build of bun's release zip
# with shell completions. Its version follows the LATEST file of oven-sh/bun.
[bun]
batch = 0

# tealdeer: official musl binary + release-published completion files.
[tealdeer]
batch = 0

# uv: official musl tarball (uv + uvx), completions generated at build time.
[uv]
batch = 0

# atuin: official gnu tarball.
[atuin]
batch = 0

# bat: official gnu tarball (man page + completions included).
[bat]
batch = 0

# eza: official gnu tarball + separate man/completions tarballs.
[eza]
batch = 0

# gnuplot: source build from the official SourceForge tarball (lean
# console/cairo configuration). Version sweeps SourceForge best_release.
[gnuplot]
batch = 0

# cava: source build from the upstream release tarball (autotools, all
# Fedora-available audio backends enabled).
[cava]
batch = 0

# pixi: official musl binary + completions generated at build time. (A
# source-build attempt was reverted — it hung in CI and costs 1-2h on
# runners; Terra builds it from source with %cargo_prep_online.)
[pixi]
batch = 0

# zotero follows terrapkg's spec (install layout, desktop file, icons,
# appstream) over the OFFICIAL prebuilt tarball — the npm source build is
# unbuildable today (its CI artifact S3 bucket 403s for current tags, see
# the zotero.spec header). Version sweeps the zotero/zotero git tag.
[zotero]
batch = 0

# xwiimote-ng is wired in but has never been through a validated build —
# its first Copr build is the validation. Watch the first run.
[xwiimote-ng]
batch = 0

# ticktick follows the AUR PKGBUILD (vendor .deb payload, launcher, SUID
# sandbox). TickTick publishes no first-party version feed, so the version
# sweeps the AUR package via the AUR RPC API — the AUR maintainer tracks
# upstream releases.
[ticktick]
batch = 0

# bitwarden: rewrap of the vendor RPM following
# github.com/anudeepd/bitwarden-fedora-copr-ci (byte-identical payload, brp
# hooks unset, per-version GPL text, curated AppStream metainfo). Version
# sweeps the desktop-v releases of bitwarden/clients.
[bitwarden]
batch = 0

# obsidian: follows the Arch Linux package (launcher with user-flags file,
# /usr/lib/obsidian, resources icon, LicenseRef-Obsidian), with the bundled
# Electron runtime shipped since Fedora has no system electron package. The
# tarball sha256 is verified in the source step against the GitHub digest.
[obsidian]
batch = 0

# ------------------------------------------------------------------- apps
# distroshelf: GNOME container manager, meson+cargo per upstream's meson.build
# (crates fetched during the build — the project runs --enable-net on).
[distroshelf]
batch = 0

# ------------------------------------------------------------------ tools
# chafa follows terrapkg's spec (upstream git-tag source build); Fedora
# carries an older chafa, this one shadows it.
[chafa]
batch = 0

[dust]
batch = 0

[lazygit]
batch = 0

[pandoc]
batch = 0

[starship]
batch = 0

[yazi]
batch = 0

[zellij]
batch = 0

# opencode: terminal AI coding agent, repackaged from the current release
# tarball.
[opencode]
batch = 0

# marksman: Markdown LSP server, wrapper over the upstream self-contained
# .NET release binary (no crates.io publish, not in Fedora).
[marksman]
batch = 0

# texlab: LaTeX LSP server, Rust source build from the release tag tarball
# (the crates.io texlab is stale upstream; yazi pattern).
[texlab]
batch = 0

# ------------------------------------------------------------ hyprland-adjacent
# nwg-look and qt6ct follow LionHeartP/hyprlandRPM (the Hyprland ecosystem
# repo, like the hyprwm stack above): nwg-look builds from the Go module
# proxy at %build time; qt6ct pins a GitLab commit of the canonical repo.
[nwg-look]
batch = 0

[qt6ct]
batch = 0

# texlive-texmf + onlyoffice-desktopeditors: the R2 wave. texlive is the
# Arch-style grouped split — ONE source spec whose subpackages are the
# collection groups of the scheme, generated from the dated tlnet-archive
# snapshot by tools/texlive-splitter. Regeneration is a maintainer step (a
# new snapshot = new %files lists), not a sweep. onlyoffice is a 363 MB
# vendor-RPM rewrap that would take a third of the Pages budget, so it
# shares this wave's R2 publish.
[texlive-texmf]
batch = 4

[onlyoffice-desktopeditors]
batch = 4
