# ci/packages.toml — the halcyon-packages build registry + sweep-feed config.
#
# Consumed by ci/matrix.py (build selection) and ci/sweep/sweep.py (version
# sweep). One table per package; **a package without an entry is not built**.
# The specs themselves live in pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# Build-time dependencies that Fedora 44 does not provide: glaze, hyprwire
# and hyprtoolkit are packaged in THIS repo (ports of the lionheartp/Hyprland
# Copr specs; the fourth input, wlroots, ships in Fedora 44 itself). The
# lionheartp Copr stays configured on the Copr chroot only as a lowest-
# priority bootstrap for fresh projects; once our own builds exist, the
# project repo wins. Terra 44 is also configured there (anda-srpm-macros for
# the rust specs). See notes/copr-setup.md.
#
# The optional [pkg.updates] table drives the daily sweep (update.yml):
#   feed = "github-release"  + repo = "owner/name"   latest GitHub release tag
#   feed = "github-tag"      + repo = "owner/name"   newest git tag
#   feed = "custom"          + custom = "<name>"     ci/sweep/custom.py function
# Packages without it (texlive-texmf) are never swept.
#
# batch 0  roots: Fedora-only build deps (plus the wrapper/binary packages)
# batch 1  first level: everything that links against batch 0
# batch 2  hyprland, hyprtoolkit — links against batch 0 and batch 1
# batch 3  the hyprtoolkit dependents (guiutils/pwcenter/shutdown)
# batch 4  texlive-texmf + onlyoffice — the heavy wave

# --------------------------------------------------------------- desktops

# --- batch 0 ------------------------------------------------------------
[hyprutils]
batch = 0

[hyprutils.updates]
feed = "github-release"
repo = "hyprwm/hyprutils"

[hyprlang]
batch = 0

[hyprlang.updates]
feed = "github-release"
repo = "hyprwm/hyprlang"

[hyprwayland-scanner]
batch = 0

[hyprwayland-scanner.updates]
feed = "github-release"
repo = "hyprwm/hyprwayland-scanner"

[hyprland-protocols]
batch = 0

[hyprland-protocols.updates]
feed = "github-release"
repo = "hyprwm/hyprland-protocols"

# glaze: header-only JSON library (provides glaze-static/glaze-devel for
# hyprland and hyprshutdown). Ported from LionHeartP/hyprlandRPM.
[glaze]
batch = 0

[glaze.updates]
feed = "github-release"
repo = "stephenberry/glaze"

# --- batch 1 ------------------------------------------------------------
# hyprland-qt-support needs hyprlang, so it cannot share hyprlang's batch.
[hyprland-qt-support]
batch = 1

[hyprland-qt-support.updates]
feed = "github-release"
repo = "hyprwm/hyprland-qt-support"

[aquamarine]
batch = 1

[aquamarine.updates]
feed = "github-release"
repo = "hyprwm/aquamarine"

[hyprcursor]
batch = 1

[hyprcursor.updates]
feed = "github-release"
repo = "hyprwm/hyprcursor"

[hyprgraphics]
batch = 1

[hyprgraphics.updates]
feed = "github-release"
repo = "hyprwm/hyprgraphics"

# hyprwire: hyprland's wire-protocol IPC library (needs hyprutils).
[hyprwire]
batch = 1

[hyprwire.updates]
feed = "github-release"
repo = "hyprwm/hyprwire"

# noctalia: the desktop shell itself, release-tracked (upstream keeps no
# stable branch; releases are cut from main). Recipe from Terra's
# noctalia-nightly. The greeter is standalone (all build deps are Fedora 44;
# wlroots ships in Fedora proper) and builds from the branch tip like hyprland
[noctalia]
batch = 0

[noctalia-greeter-git]
batch = 1

[noctalia-greeter-git.updates]
feed = "custom"
custom = "noctalia-greeter-git"

[xdg-desktop-portal-hyprland]
batch = 1

[xdg-desktop-portal-hyprland.updates]
feed = "custom"
custom = "xdg-desktop-portal-hyprland"

# pyprland: Hyprland companion daemon (hatchling wheel + compiled C client,
# per the AUR PKGBUILD); version sweeps the git tags.
[pyprland]
batch = 0

[pyprland.updates]
feed = "github-tag"
repo = "hyprland-community/pyprland"

# --- batch 2 ------------------------------------------------------------
# hyprland: git snapshot (main-branch pin), the ~15-minute one. Needs
# glaze (batch 0) and hyprwire (batch 1) from this repo.
[hyprland]
batch = 2

[hyprland.updates]
feed = "custom"
custom = "hyprland"

# hyprtoolkit: the GUI toolkit for guiutils/pwcenter/shutdown (needs
# aquamarine + hyprgraphics from batch 1).
[hyprtoolkit]
batch = 2

[hyprtoolkit.updates]
feed = "github-release"
repo = "hyprwm/hyprtoolkit"

# --- batch 3 ------------------------------------------------------------
