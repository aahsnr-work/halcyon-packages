config_opts['root'] = 'halcyon-f44-x86_64'
config_opts['dist'] = 'fc44'
config_opts['macros']['%dist'] = '.fc44'
# cap build parallelism at 12 cores for EVERY package, rust or otherwise —
# cargo (-j%{_smp_build_ncpus} in the cargo macros), cmake/meson
# (%_smp_mflags) and friends all derive from this one macro; don't override
# it per-spec
config_opts['macros']['%_smp_build_ncpus'] = '12'
config_opts['package_manager'] = 'dnf5'
config_opts['target_arch'] = 'x86_64'
config_opts['legal_host_arches'] = ('x86_64',)
config_opts['extra_chroot_dirs'] = [ '/run/lock', ]
config_opts['use_bootstrap'] = False
config_opts['chroot_setup_cmd'] = 'install @buildsys-build'
# The cache plugins (root/yum/ccache) bind-mount host dirs into the chroot;
# inside ephemeral build containers their state is discarded every run anyway
# and the mounts break mock's chroot cleanup with EBUSY — all disabled.
config_opts['plugin_conf']['root_cache_enable'] = False
config_opts['plugin_conf']['yum_cache_enable'] = False
config_opts['plugin_conf']['ccache_enable'] = False
# The one bind mount we DO need locally: a persistent sccache cache dir on
# the workspace (survives across container runs, shared by every rust source
# build). The earlier EBUSY scare that disabled the cache plugins does not
# reproduce on mock 6.8 + the setuid-umount fix in the builder image — with
# nspawn isolation the chroot's processes (incl. the sccache server) die with
# the nspawn container before mock unmounts. Verified 2026-09-25 with a full
# init/write/clean cycle; keep an eye on teardown in the first builds.
#
# Conditional on /h existing: local podman runs mount the workspace there,
# CI containers mount it at /__w/... (and runners are ephemeral — a
# persistent cache buys nothing between jobs), where an unconditional mount
# fails hard in chroot init (mount exit 32) and kills every build.
import os
if os.path.exists('/h/anda-build/sccache-cache'):
    config_opts['plugin_conf']['bind_mount_enable'] = True
    config_opts['plugin_conf']['bind_mount_opts']['dirs'] = [
        ('/h/anda-build/sccache-cache', '/sccache'),
    ]
else:
    config_opts['plugin_conf']['bind_mount_enable'] = False
# repos
dnf_conf = """

[main]
keepcache=1
debuglevel=2
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=mock
syslog_device=
install_weak_deps=0
metadata_expire=0
best=1
module_platform_id=platform:fc44
protected_packages=
max_parallel_downloads=20

[fedora]
name=fedora
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=$basearch
gpgkey=file:///usr/share/distribution-gpg-keys/fedora/RPM-GPG-KEY-fedora-44-primary
gpgcheck=1
skip_if_unavailable=False
exclude=fedora-release*

[updates]
name=updates
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
gpgkey=file:///usr/share/distribution-gpg-keys/fedora/RPM-GPG-KEY-fedora-44-primary
gpgcheck=1
skip_if_unavailable=False

# halcyon-packages' own published repo — what makes a lower batch's output
# installable as a later batch's BuildRequires. skip_if_unavailable keeps the
# very first build (before anything was ever published) from failing.
[halcyon-packages]
name=halcyon-packages
baseurl=https://aahsnr-work.github.io/halcyon-packages/repo/f44/x86_64/
gpgkey=https://aahsnr-work.github.io/halcyon-packages/repo/RPM-GPG-KEY-halcyon-packages
gpgcheck=1
repo_gpgcheck=1
skip_if_unavailable=True
enabled=1
enabled_metadata=1
priority=10

# the texlive-texmf subpackage set (published to the R2 bucket — the same
# repo file's [halcyon-texlive] section). skip_if_unavailable until the
# first texlive publish lands; needed as a buildroot repo only when another
# package BuildRequires texlive-<group> files.
[halcyon-texlive]
name=halcyon-texlive
baseurl=https://r2.halcyon-packages.example.com/texlive/f44/x86_64/
gpgkey=https://aahsnr-work.github.io/halcyon-packages/repo/RPM-GPG-KEY-halcyon-packages
gpgcheck=1
repo_gpgcheck=1
skip_if_unavailable=True
enabled=1
enabled_metadata=1
priority=10

# build-time-only inputs Fedora 44 does not ship (glaze-static, hyprtoolkit,
# hyprwire, wlroots ...). Replaces the project-level `copr://lionheartp/Hyprland`
# repo the Copr project carried; mock/dnf need the direct baseurl.
[lionheartp-hyprland]
name=Copr lionheartp/Hyprland
baseurl=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-44-x86_64/
gpgcheck=0
skip_if_unavailable=True
enabled=1
enabled_metadata=1
priority=100

# supplies anda-srpm-macros (the online cargo prep/license macros every rust
# source build needs) — upstreamed to Terra, not to Fedora. Build-time only.
[terra]
name=Terra 44
baseurl=https://repos.fyralabs.com/terra44
gpgcheck=0
skip_if_unavailable=True
enabled=1
enabled_metadata=1
priority=100
"""


config_opts['dnf.conf'] = dnf_conf
config_opts['dnf5.conf'] = dnf_conf
