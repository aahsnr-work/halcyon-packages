config_opts['root'] = 'halcyon-f44-x86_64'
config_opts['dist'] = 'fc44'
config_opts['macros']['%dist'] = '.fc44'
config_opts['package_manager'] = 'dnf5'
config_opts['extra_chroot_dirs'] = [ '/run/lock', ]
config_opts['use_bootstrap'] = False
config_opts['chroot_setup_cmd'] = 'install @buildsys-build'
config_opts['chroot_additional_packages'] = ['anda-srpm-macros']
config_opts['plugin_conf']['root_cache_enable'] = True
config_opts['plugin_conf']['yum_cache_enable'] = True
config_opts['plugin_conf']['ccache_enable'] = True
config_opts['plugin_conf']['ccache_opts']['compress'] = 'on'
config_opts['plugin_conf']['ccache_opts']['max_cache_size'] = '10G'
# repos
dnf_conf = """

[main]
keepcache=1
debuglevel=2
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=mock
syslog_device=
install_weak_deps=0
metadata_expire=0
best=1
module_platform_id=platform:fc44
protected_packages=
max_parallel_downloads=20

[fedora]
name=fedora
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=$basearch
gpgkey=file:///usr/share/distribution-gpg-keys/fedora/RPM-GPG-KEY-fedora-44-primary
gpgcheck=1
skip_if_unavailable=False
exclude=fedora-release*

[updates]
name=updates
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
gpgkey=file:///usr/share/distribution-gpg-keys/fedora/RPM-GPG-KEY-fedora-44-primary
gpgcheck=1
skip_if_unavailable=False

# halcyon-packages' own published repo — what makes a lower batch's output
# installable as a later batch's BuildRequires. skip_if_unavailable keeps the
# very first build (before anything was ever published) from failing.
[halcyon-packages]
name=halcyon-packages
baseurl=https://aahsnr-work.github.io/halcyon-packages/repo/f44/x86_64/
gpgkey=https://aahsnr-work.github.io/halcyon-packages/repo/RPM-GPG-KEY-halcyon-packages
gpgcheck=1
repo_gpgcheck=1
skip_if_unavailable=True
enabled=1
enabled_metadata=1
priority=10

# build-time-only inputs Fedora 44 does not ship (glaze-static, hyprtoolkit,
# hyprwire, wlroots ...). Replaces the project-level `copr://lionheartp/Hyprland`
# repo the Copr project carried; mock/dnf need the direct baseurl.
[lionheartp-hyprland]
name=Copr lionheartp/Hyprland
baseurl=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-44-x86_64/
gpgcheck=0
skip_if_unavailable=True
enabled=1
enabled_metadata=1
priority=100
"""


config_opts['dnf.conf'] = dnf_conf
config_opts['dnf5.conf'] = dnf_conf
